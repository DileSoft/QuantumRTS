<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- outer ring, white -> tinted green (heal) / red (danger) -->
  <circle cx="12" cy="12" r="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- cross core (stays dark) -->
  <rect x="10.2" y="6" width="3.6" height="12" rx="1" fill="#222"/>
  <rect x="6" y="10.2" width="12" height="3.6" rx="1" fill="#222"/>
</svg>
