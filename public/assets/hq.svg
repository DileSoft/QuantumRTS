<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- flag pole (stays dark) -->
  <rect x="37" y="2" width="4" height="20" fill="#222"/>
  <!-- flag (team color via tint) -->
  <polygon points="41,3 63,8 41,13" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <!-- top block (team color via tint) -->
  <rect x="20" y="20" width="40" height="14" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <!-- main base (team color via tint) -->
  <rect x="10" y="34" width="60" height="36" fill="#fff" stroke="#111" stroke-width="3"/>
  <!-- emblem ring (stays dark) -->
  <circle cx="40" cy="52" r="10" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="40" cy="52" r="3" fill="#222"/>
  <!-- door (stays dark) -->
  <rect x="34" y="60" width="12" height="10" fill="#222"/>
</svg>
